name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: myjob
          POSTGRES_USER: myjob
          POSTGRES_PASSWORD: myjob
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myjob -d myjob"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Use Postgres
        if: matrix.db == 'postgres'
        run: |
          {
            echo "POSTGRES_DB=myjob"
            echo "POSTGRES_USER=myjob"
            echo "POSTGRES_PASSWORD=myjob"
            echo "POSTGRES_HOST=localhost"
          } >> "$GITHUB_ENV"

      - name: System check
        run: uv run python manage.py check

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run python manage.py test --verbosity 2

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # frontend/ is optional in this repository; skip cleanly when it is not committed
      - name: Detect frontend
        id: fe
        working-directory: .
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.fe.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.fe.outputs.present == 'true'
        run: npm ci

      - name: Build
        if: steps.fe.outputs.present == 'true'
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
