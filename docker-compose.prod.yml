# Production stack: Django (gunicorn) + Postgres + Redis + Caddy (HTTPS, media).
# Runs on the server with a hand-written .env next to this file (see .env.example).
name: myjob

services:
  web:
    image: ${IMAGE:?set IMAGE, e.g. ghcr.io/owner/repo:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - media:/app/media

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
